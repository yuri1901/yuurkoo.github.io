<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Про мене</title>
</head>
<body>
  <header>
    <h1>Про мене</h1>
  </header>

  <main>
    <section>
      <h2>Коротко</h2>
      <p>Мене звати Олексій. Я навчаюся основ HTML та створюю прості вебсторінки.</p>

      <h2>Мої інтереси</h2>
      <ul>
        <li>Веброзробка</li>
        <li>Навчання</li>
        <li>Читання</li>
      </ul>
    </section>

    <section>
      <h2>Зв'язок зі мною</h2>
      <form>
        <p>
          <label for="name">Ім'я:</label><br>
          <input type="text" id="name" name="name">
        </p>

        <p>
          <label for="email">Електронна пошта:</label><br>
          <input type="email" id="email" name="email">
        </p>

        <p>
          <label for="topic">Оберіть тему:</label><br>
          <select id="topic" name="topic">
            <option value="question">Запитання</option>
            <option value="cooperation">Співпраця</option>
            <option value="feedback">Відгук</option>
          </select>
        </p>

        <p>
          <label for="message">Повідомлення:</label><br>
          <textarea id="message" name="message" rows="5" cols="30"></textarea>
        </p>

        <button type="submit">Відправити</button>
      </form>
    </section>
  </main>
</body>
</html>
